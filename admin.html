<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t==="light")document.documentElement.dataset.theme="light"})()</script>
<script src="data/theme.js?v=73dd7fc6"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Site Editor · Sam Cao</title>
<link rel="icon" href="assets/website/my-notion-face-transparent.ico" type="image/x-icon">

<style>
  /* Editor layout: sticky toolbar, section list on the left, form on the right. */
  body { min-height: 100vh; }
  .ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--header-line); }
  .ed-bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; max-width: 1100px; }
  .ed-title { display: flex; align-items: center; gap: 10px; margin-right: auto; font: 700 18px/1 var(--body); color: var(--heading); }
  .ed-title img { width: 30px; height: 30px; border-radius: 50%; background: #f6f1e6; box-shadow: 0 0 0 2px var(--accent); }
  .ed-status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .ed-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .ed-status.on i { background: #2fa36b; }
  .ed-dirty { color: var(--accent); font-weight: 700; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none !important; }
  .ed { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 32px; max-width: 1100px; padding-block: 28px 80px; }
  @media (max-width: 760px) { .ed { grid-template-columns: minmax(0, 1fr); gap: 16px; } .ed-nav { flex-direction: row !important; flex-wrap: wrap; position: static !important; } }
  .ed-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 90px; align-self: start; }
  .ed-nav button { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 6px; cursor: pointer; font: 600 14px var(--body); color: var(--text); transition: background .15s, color .15s; }
  .ed-nav button:hover { background: var(--bg-raised); color: var(--heading); }
  .ed-nav button[aria-current="true"] { background: var(--surface); color: var(--heading); box-shadow: inset 2px 0 0 var(--accent); }
  .ed-main { min-width: 0; }
  .ed-main h1 { margin: 0 0 4px; font: 700 26px/1.2 var(--display); color: var(--heading); }
  .ed-help { margin: 0 0 20px; color: var(--muted); max-width: 70ch; }
  .ed-help code, .ed-tools code { background: var(--bg-raised); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .f { display: grid; gap: 5px; margin-bottom: 14px; min-width: 0; }
  .f > span { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .f small { color: var(--muted); font-size: 12px; }
  .f input[type=text], .f input[type=date], .f input[type=url], .f select, .f textarea {
    width: 100%; min-width: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg-glow); color: var(--text-strong);
    font: 400 14px/1.5 var(--body); padding: 8px 10px; transition: border-color .15s, box-shadow .15s; }
  .f textarea { min-height: 84px; resize: vertical; }
  .f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .f.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  .f.check > span { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--text-strong); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px; }
  @media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
  .filerow { display: flex; gap: 8px; }
  .filerow input { flex: 1; }
  .card { border: 1px solid var(--line); border-radius: 8px; background: var(--bg-raised); margin-bottom: 10px; transition: box-shadow .2s; }
  .card.new { animation: pop .35s var(--ease); box-shadow: 0 0 0 2px var(--accent); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .card-head b { flex: 1; min-width: 0; color: var(--heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head .pill { flex: none; }
  .card-head .chev { transition: transform .2s var(--ease); color: var(--muted); }
  .card.open .chev { transform: rotate(90deg); }
  .card-body { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  .card.open .card-body { display: block; }
  .icon-btn { width: 30px; height: 30px; flex: none; border: 0; border-radius: 6px; background: var(--surface); color: var(--text-strong); cursor: pointer; font-size: 14px; transition: background .15s, transform .15s var(--ease); }
  .icon-btn:hover { background: var(--line-strong); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.danger:hover { background: var(--accent); color: var(--on-accent); }
  .rows .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .rows .row input { width: 100%; min-width: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg-glow); color: var(--text-strong); font: 14px var(--body); padding: 7px 9px; }
  .rows .row.three { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr) minmax(0, 2fr) minmax(0, 1fr) auto auto auto; }
  @media (max-width: 600px) { .rows .row, .rows .row.three { grid-template-columns: minmax(0, 1fr) auto auto auto; } .rows .row input:not(:first-child) { grid-column: 1 / 2; } }
  .confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--accent); }
  .add { margin: 6px 0 22px; }
  .ed-tools { margin-top: 30px; padding: 16px; border-radius: 8px; background: var(--bg-raised); border: 1px dashed var(--line-strong); font-size: 13px; }
  .ed-tools p { margin: 0 0 8px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .pal-card { display: grid; gap: 8px; padding: 8px 8px 10px; border: 0; border-radius: 10px; cursor: pointer; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); text-align: left; color: var(--text-strong); font: 600 13px var(--body); transition: transform .15s var(--ease), box-shadow .2s; }
  .pal-card:hover { transform: translateY(-2px); }
  .pal-card[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .pal-prev { display: grid; grid-template-columns: 1fr 1fr; height: 64px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--edge); }
  .pal-prev > span { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px; }
  .pal-prev i { display: block; height: 7px; border-radius: 3px; }
  .pal-prev i + i { width: 60%; }
  .accents { display: flex; flex-wrap: wrap; gap: 8px; }
  .acc { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border: 0; border-radius: 20px; cursor: pointer; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-strong); font: 600 13px var(--body); transition: transform .15s var(--ease), box-shadow .2s; }
  .acc i { width: 18px; height: 18px; border-radius: 50%; }
  .acc[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .acc:active, .pal-card:active { transform: scale(.96); }
  .theme-demo { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 22px; padding: 14px 16px; border-radius: 8px; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); }
  .theme-demo .read-link { margin: 0; }
  .font-demo { margin-top: 6px; padding: 16px 18px; border-radius: 8px; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); }
  .font-demo p { margin: 0 0 8px; }
  .fd-name { font: var(--dw, 700) 34px/1.1 var(--display); color: var(--heading); letter-spacing: -.025em; }
  .fd-cjk { font: var(--cjkw, 600) 22px/1 var(--cjk); color: var(--text-strong); margin-left: 6px; letter-spacing: 0; }
  .fd-title { font: var(--dw, 700) 20px/1.25 var(--display); color: var(--heading); }
  .fd-body { font: 400 15px/1.6 var(--body); color: var(--text); max-width: 60ch; }
  .card-thumb { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; flex: none; box-shadow: 0 0 0 1px var(--edge); }
  .logform { padding: 18px 18px 6px; border-radius: 10px; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--line); }
  .logform h2 { margin: 0 0 14px; font: 700 18px/1.2 var(--display); color: var(--heading); }
  .logform .f.check { margin-top: 26px; }
  .f input[type=text], .f input[type=date], .f input[type=url], .f select { height: 40px; }
  .logform input[readonly] { opacity: .7; }
  .logbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .danger-btn:hover { background: var(--accent); color: var(--on-accent); }
  .lfilter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .lfilter input, .lfilter select { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg-glow); color: var(--text-strong); font: 14px var(--body); padding: 8px 10px; }
  .lfilter select, .lfilter .short { flex: 0 1 150px; }
  .llist, .chips { list-style: none; margin: 0 0 8px; padding: 0; }
  .lrow { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) 110px 110px 100px; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: 14px var(--body); text-align: left; cursor: pointer; transition: background .15s; }
  .lrow.f4 { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) 110px 100px; }
  .lrow:hover { background: var(--bg-raised); }
  .lrow.static { grid-template-columns: minmax(0, 2.2fr) minmax(0, .6fr) 100px auto; cursor: default; }
  .lrow b { color: var(--heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .lr-stars { color: var(--accent) !important; }
  .lr-date { font-variant-numeric: tabular-nums; text-align: right; }
  .lr-acts { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .llist { max-height: 460px; overflow-y: auto; border-top: 1px solid var(--line); }
  .lempty { padding: 10px; color: var(--muted); font-size: 13px; }
  .chips li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--heading); }
  @media (max-width: 600px) { .lrow { grid-template-columns: minmax(0, 1fr) auto; } .lrow > span:not(.lr-stars) { display: none; } .lrow.static { grid-template-columns: minmax(0, 1fr) auto; } }
  .notice { padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, var(--bg-raised)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); margin-bottom: 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="ed-bar"><div class="wrap">
  <div class="ed-title"><img src="assets/website/logo.png" alt="">Site editor</div>
  <span class="ed-status" id="status"><i></i><span>Not connected</span></span>
  <span class="ed-dirty" id="dirty" hidden>Unsaved changes</span>
  <button class="btn" type="button" id="connect">Connect site folder</button>
  <button class="btn" type="button" id="download" title="Download content.js (for browsers that cannot save to the folder)">Download</button>
  <button class="btn go" type="button" id="save" disabled>Save</button>
  <button class="btn" type="button" id="mode">Preview light</button>
  <a class="btn" href="index.html" target="_blank" rel="noopener">View site ↗</a>
</div></div>
<div class="wrap ed">
  <nav class="ed-nav" id="nav" aria-label="Sections"></nav>
  <main class="ed-main" id="main"></main>
</div>
<script src="data/content.js?v=21d6554a"></script>
<script src="data/books.js?v=2f7c6882"></script>
<script src="data/films.js?v=74d8c646"></script>
<script src="assets/admin.js?v=3c082c1e"></script>
</body>
</html>
